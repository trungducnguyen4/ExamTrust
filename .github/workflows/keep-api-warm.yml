name: Keep API warm

# Render's free web service spins down after 15 minutes without traffic and the
# next request waits ~1 minute for the container to boot. Pinging the health
# endpoint keeps the demo responsive.
#
# Schedule window: 00:00-15:50 UTC = 07:00-22:50 Asia/Saigon, roughly the hours
# a demo is used. That is ~16 h/day => ~480 instance-hours/month, safely below
# the 750 free hours (keeping it warm 24/7 would use ~744 and leave no margin).

on:
  schedule:
    - cron: "*/10 0-15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          API_HEALTH_URL: https://examtrust-api.onrender.com/api/health
        run: |
          for attempt in 1 2 3; do
            start=$(date +%s)
            if body=$(curl -fsS --max-time 90 "$API_HEALTH_URL"); then
              end=$(date +%s)
              echo "ok in $((end - start))s: $body"
              exit 0
            fi
            echo "attempt $attempt failed after $(( $(date +%s) - start ))s"
            sleep 20
          done
          echo "::warning::health check failed three times"
          exit 1
