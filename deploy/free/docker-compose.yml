# ExamTrust — self-hosted free deployment (Oracle Cloud Always Free)
# Usage: docker compose --env-file .env -f docker-compose.yml up -d --build
#
# Runs the whole stack on one small VM: MySQL 8, Redis 7, NestJS API,
# AI background worker, and Caddy as the HTTPS reverse proxy.
# The frontend stays on Vercel (Next.js); it talks to https://$API_DOMAIN/api.

name: examtrust

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examtrust}
      MYSQL_USER: ${MYSQL_USER:-examtrust}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: ../../BE
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: mysql://${MYSQL_USER:-examtrust}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-examtrust}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - internal

  ai-worker:
    build:
      context: ../../BE
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/ai-worker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-examtrust}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-examtrust}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env, e.g. 140-238-1-2.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
